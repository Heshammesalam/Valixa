name: Approved npm release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed version from release/config.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: valixa-npm-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-tarballs
          path: artifacts/release
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.VALIXA_RELEASE_READY == 'true'
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: approved-tarballs
          path: artifacts/release
      - name: Publish only reviewed immutable artifacts using OIDC
        env:
          RELEASE_APPROVED_VERSION: ${{ inputs.version }}
          RELEASE_CONFIGURATION_VERIFIED: ${{ vars.VALIXA_RELEASE_READY }}
        run: node scripts/publish-release.mjs
